name: Refresh current figures

# The satellite record lags by months, so the HUD's headline number comes from
# NOAA GML and ERA5 instead. Fetched here and committed rather than fetched in
# the browser: the piece then never depends on those hosts being reachable when
# someone opens it, and the numbers are reviewable in git.
#
# The values move ~2.5 ppm a year, so weekly is ample. Committing pushes to
# main, which triggers deploy.yml - that workflow never commits, so there is no
# loop.
on:
  schedule:
    # Mondays, 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# Never race a run against itself; a queued run has nothing to add.
concurrency:
  group: refresh-current
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # No dependencies - plain Node with global fetch. Exits 0 even when a
      # source is down, leaving that layer's committed value in place.
      - run: node tools/fetch-current.mjs

      - name: Commit if the figures moved
        run: |
          if git diff --quiet -- public/data/current.json; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/current.json
          git commit -m "Refresh current global figures

          Automated: tools/fetch-current.mjs against NOAA GML and ERA5."
          git push
