<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />

    <title>Climate Globe — 23 years of the atmosphere</title>
    <meta
      name="description"
      content="Twenty-three years of CO₂, methane, carbon monoxide and temperature as a globe that swells and reddens — 280 months of NASA AIRS data, rendered in WebGL2."
    />
    <meta name="author" content="Nikita Rokotyan" />

    <!-- Absolute URLs: link scrapers do not resolve relative paths, so these
         cannot use Vite's relative base and are pinned to the Pages origin.
         social.png lives in public/ rather than docs/ because only what Vite
         copies into dist/ is actually served. -->
    <link rel="canonical" href="https://rokotyan.github.io/airs-co2/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Climate Globe" />
    <meta property="og:title" content="Climate Globe" />
    <meta
      property="og:description"
      content="Twenty-three years of CO₂, methane, carbon monoxide and temperature as a globe that swells and reddens — 280 months of NASA AIRS data, rendered in WebGL2."
    />
    <meta property="og:url" content="https://rokotyan.github.io/airs-co2/" />
    <meta property="og:image" content="https://rokotyan.github.io/airs-co2/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A green globe on black, its surface furred with per-cell satellite retrieval noise, above a green-to-red colour scale."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Climate Globe" />
    <meta
      name="twitter:description"
      content="Twenty-three years of CO₂, methane, carbon monoxide and temperature as a globe that swells and reddens — 280 months of NASA AIRS data, rendered in WebGL2."
    />
    <meta name="twitter:image" content="https://rokotyan.github.io/airs-co2/social.png" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="hud">
      <div id="cities"></div>

      <div id="hud-top">
        <div id="info"></div>
        <div id="caption">
          made by Nikita Rokotyan
          <span aria-hidden="true">·</span>
          <a href="https://rokotyan.com" target="_blank" rel="noopener">rokotyan.com</a>
          <span aria-hidden="true">·</span>
          <a href="https://github.com/rokotyan" target="_blank" rel="noopener">GitHub</a>
          <span aria-hidden="true">·</span>
          <a href="https://cosmograph.app" target="_blank" rel="noopener">cosmograph.app</a>
        </div>
        <div id="readout">
          <div id="date"></div>
          <div id="ppm"></div>
          <div id="source"></div>
        </div>
      </div>

      <div id="hint">TAP TO PAUSE</div>

      <div id="layers"></div>

      <div id="legend">
        <canvas id="colorbar" width="400" height="14"></canvas>
        <div id="colorbar-labels">
          <span id="vmin-label"></span><span id="vmax-label"></span>
        </div>
      </div>
    </div>

    <div id="controls"></div>

    <div id="loading">loading co2 data&hellip;</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
